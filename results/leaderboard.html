      `<button data-k="${c.k}">${c.l}${state.sort === c.k ? (state.dir < 0 ? " ↓" : " ↑") : ""}</button>`}${c.blk ? `<span class="blk">${c.blk}</span>` : ""}</th>`).join("") + "</tr>";
  document.querySelectorAll("#t thead button").forEach(b => b.onclick = () => {
    const k = b.dataset.k; state.dir = state.sort === k ? -state.dir : (k === "model" ? 1 : -1); state.sort = k; save(); render();
  });
}
function render() {
  head();
  let rows = DATA.rows.filter(r => (state.g === "all" || r.group === state.g) && r.model.toLowerCase().includes(state.q.toLowerCase()));
  rows.sort((a, b) => {
    const x = a[state.sort], y = b[state.sort];
    if (typeof x === "string") return state.dir * x.localeCompare(y);
    return state.dir * ((x ?? -1) - (y ?? -1));
  });
  const C = cols(), G = GL();
  document.querySelector("#t tbody").innerHTML = rows.map((r, i) => "<tr>" + C.map(c => {
    if (c.k === "rank") return `<td class="rank">${i + 1}</td>`;
    if (c.k === "model") return `<td class="l model"><div class="mname">${r.model}</div><div class="meta"><span class="tag ${r.group}">${G[r.group] || r.group}</span><span>${r.quant || ""}</span>${r.gb ? `<span>${r.gb} GB</span>` : ""}${r.complete ? "" : '<span class="warn">' + t("inc") + '</span>'}</div></td>`;
    if (c.k === "overall") return `<td><div class="ov"><b>${fmt(r.overall)}</b><span class="meter"><i style="width:${r.overall || 0}%"></i></span></div></td>`;
    if (c.k === "tok_s") return `<td class="sep dim">${r.tok_s == null ? "–" : r.tok_s.toFixed(0)}</td>`;
    if (c.k === "trunc") return `<td class="${r.trunc >= 10 ? "warn" : "dim"}">${r.trunc == null ? "–" : r.trunc.toFixed(0)}</td>`;
    const v = r[c.k];
    return `<td class="${c.heat ? "h" : ""} ${c.sep ? "sep" : ""}" ${c.heat ? `style="${heat(v)}"` : ""} title="${c.heat && r[c.k + "_n"] ? "n=" + r[c.k + "_n"] : ""}">${c.heat ? fmt(v) : `<b>${fmt(v)}</b>`}</td>`;
  }).join("") + "</tr>").join("");
  document.getElementById("count").textContent = `${rows.length} ${t("models")}`;
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.g === state.g)));
}
function summary() {
  const best = g => DATA.rows.filter(r => r.group === g && r.overall != null).sort((a, b) => b.overall - a.overall)[0];
  const local = DATA.rows.filter(r => (r.group === "baseline" || r.group === "finance" || r.group === "uncensored") && r.overall != null).sort((a, b) => b.overall - a.overall)[0];
  const cards = [
    [t("bestF"), best("frontier-cli")], [t("bestL"), local], [t("bestFin"), best("finance")],
  ];
  const done = DATA.rows.filter(r => r.complete).length;
  document.getElementById("summary").innerHTML = cards.map(([k, r]) => `<div class="card"><span class="k">${k}</span>${r ?
    `<span class="v">${fmt(r.overall)}</span><span class="n">${r.model}</span>` : `<span class="n dim">${t("none")}</span>`}</div>`).join("") +
    `<div class="card"><span class="k">${t("done")}</span><span class="v">${done}</span><span class="n dim">${DATA.pending.length} ${t("mq")}</span></div>`;
}
document.querySelectorAll(".chip[data-g]").forEach(b => b.onclick = () => { state.g = b.dataset.g; save(); render(); });
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
document.getElementById("lang").onclick = () => { state.lang = state.lang === "en" ? "tr" : "en"; save(); applyLang(); };
function applyLang() {
  document.documentElement.lang = state.lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); el.setAttribute("aria-label", t(el.dataset.i18nPh)); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.getElementById("lang").textContent = t("lang");
  document.getElementById("stamp").textContent = `${t("upd")} ${DATA.generated} · Tier-1 · 835 ${t("qpm")}`;
  const L = state.lang === "tr" ? "" : "_en";
  document.querySelector("#tasks tbody").innerHTML = DATA.tasks.map(x => `<tr><td><b>${x.label}</b><br><span class="dim">${x["desc" + L] || x.desc}</span></td><td>${x.block === "sentiment" ? t("sent") : t("num")}</td><td>${x.n}</td><td>${x["metric" + L] || x.metric}</td></tr>`).join("");
  document.getElementById("pending").innerHTML = DATA.pending.map(p => `<span>${typeof p === "string" ? p : p.id + (p.slow ? " · " + t("slow") : "")}</span>`).join("");
  document.getElementById("foot").textContent = t("foot");
  summary(); render();
}
document.getElementById("pendingbox").hidden = !DATA.pending.length;
applyLang();
</script>
