<style>
/* Layout: summary strip -> filter bar -> one scrollable ranking table (heat cells per task) -> method notes */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --fg: #17212b; --muted: #5b6977; --line: #d9e0e6;
  --accent: #0b5f7a; --accent-soft: #dcecf2;
  --frontier: #6a3fb0; --baseline: #0b5f7a; --finance: #b45a12; --openrouter: #2f7d32; --uncensored: #a3264b;
  --heat-lo: #f6e1dc; --heat-mid: #f4efd6; --heat-hi: #d9efe2; --heat-fg: #17212b;
  --warn: #a4400b;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151b; --surface: #16202a; --fg: #e3e9ef; --muted: #93a2b1; --line: #2a3744;
  --accent: #5cb8d6; --accent-soft: #173745;
  --frontier: #b394ee; --baseline: #5cb8d6; --finance: #eaa066; --openrouter: #7cc47f; --uncensored: #f0829f;
  --heat-lo: #4a2a26; --heat-mid: #3d3a26; --heat-hi: #1f4231; --heat-fg: #e3e9ef; --warn: #f0925a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #16202a; --fg: #e3e9ef; --muted: #93a2b1; --line: #2a3744;
  --accent: #5cb8d6; --accent-soft: #173745;
  --frontier: #b394ee; --baseline: #5cb8d6; --finance: #eaa066; --openrouter: #7cc47f; --uncensored: #f0829f;
  --heat-lo: #4a2a26; --heat-mid: #3d3a26; --heat-hi: #1f4231; --heat-fg: #e3e9ef; --warn: #f0925a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body) }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; display: grid; gap: 28px }
header { display: grid; gap: 6px; position: relative }
#lang { position: absolute; top: 0; right: 0 }
header h1, header .eyebrow { padding-right: 96px }
.eyebrow { font: 500 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
h1 { font: 800 clamp(28px, 4vw, 44px)/1.05 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em }
.lede { color: var(--muted); max-width: 70ch; margin: 0 }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0 }
.card .k { font: 500 12px var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase }
.card .v { font: 800 30px/1 var(--f-display); font-variant-numeric: tabular-nums }
.card .n { font-weight: 600; overflow-wrap: anywhere }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chip { font: 500 13px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 12px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.chip:focus-visible, input:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#q { font: 14px var(--f-body); padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); min-width: 0; flex: 1 1 200px; max-width: 320px }
.count { margin-left: auto; font: 13px var(--f-mono); color: var(--muted) }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px }
table { border-collapse: collapse; width: 100%; min-width: 980px; font-variant-numeric: tabular-nums }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap }
th { font: 500 12px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; background: var(--surface); z-index: 1 }
th button { all: unset; cursor: pointer }
th.sorted { color: var(--fg) }
th .blk { display: block; font-size: 10px; opacity: .8 }
td.l, th.l { text-align: left }
td.rank { color: var(--muted); font: 13px var(--f-mono); width: 36px }
td.model { max-width: 360px; white-space: normal; min-width: 240px }
.mname { font-weight: 600; overflow-wrap: anywhere }
.meta { font: 12px var(--f-mono); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px }
.tag { font: 600 11px var(--f-mono); padding: 1px 7px; border-radius: 4px; border: 1px solid currentColor; letter-spacing: .03em }
.tag.frontier-cli { color: var(--frontier) } .tag.baseline { color: var(--baseline) } .tag.finance { color: var(--finance) } .tag.openrouter-free, .tag.openrouter-paid { color: var(--openrouter) } .tag.uncensored { color: var(--uncensored) }
.ov { display: flex; align-items: center; gap: 8px; justify-content: flex-end }
.ov b { font: 800 17px var(--f-display); min-width: 44px; text-align: right }
.meter { width: 84px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--accent) }
td.h { color: var(--heat-fg); font-family: var(--f-mono); font-size: 13px }
td.sep { border-left: 1px solid var(--line) }
.warn { color: var(--warn); font-weight: 600 }
.dim { color: var(--muted) }
tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent) }
section h2 { font: 800 22px var(--f-display); margin: 0 0 10px }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px }
.notes > div { min-width: 0 }
.notes p, .notes li { color: var(--muted); max-width: 68ch }
.notes ul { padding-left: 18px; margin: 0; display: grid; gap: 6px }
.tasks td, .tasks th { text-align: left; white-space: normal }
.tasks { min-width: 560px }
.pending { display: flex; flex-wrap: wrap; gap: 6px }
.pending span { font: 12px var(--f-mono); border: 1px dashed var(--line); border-radius: 6px; padding: 3px 8px; color: var(--muted) }
footer { font: 12px var(--f-mono); color: var(--muted) }
@media (max-width: 520px) { .wrap { padding-inline: 16px } .count { margin-left: 0; width: 100% } }
@media (prefers-reduced-motion: no-preference) { .meter i { transition: width .4s ease } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="stamp"></div>
    <button class="chip" id="lang" type="button"></button>
    <h1 data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>
  </header>

  <div class="summary" id="summary"></div>

  <div class="bar" role="group" data-i18n-aria="filter">
    <button class="chip" data-g="all" aria-pressed="true" data-i18n="all"></button>
    <button class="chip" data-g="frontier-cli" aria-pressed="false">Frontier (CLI)</button>
    <button class="chip" data-g="openrouter-free" aria-pressed="false" data-i18n="orfree"></button>
    <button class="chip" data-g="openrouter-paid" aria-pressed="false" data-i18n="orpaid"></button>
    <button class="chip" data-g="baseline" aria-pressed="false" data-i18n="base"></button>
    <button class="chip" data-g="uncensored" aria-pressed="false" data-i18n="unc"></button>
    <button class="chip" data-g="finance" aria-pressed="false" data-i18n="fin"></button>
    <input id="q" type="search" data-i18n-ph="search">
    <span class="count" id="count"></span>
  </div>

  <div class="tablebox"><table id="t"><thead></thead><tbody></tbody></table></div>

  <section id="pendingbox">
    <h2 data-i18n="queued"></h2>
    <div class="pending" id="pending"></div>
  </section>

  <section class="notes">
    <div>
      <h2 data-i18n="tasks"></h2>
      <div class="tablebox"><table class="tasks" id="tasks"><thead><tr><th data-i18n="task"></th><th data-i18n="block"></th><th data-i18n="qs"></th><th data-i18n="metric"></th></tr></thead><tbody></tbody></table></div>
    </div>
    <div>
      <h2 data-i18n="method"></h2>
      <ul><li data-i18n="m1"></li><li data-i18n="m2"></li><li data-i18n="m3"></li><li data-i18n="m4"></li><li data-i18n="m5"></li><li data-i18n="m6"></li></ul>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/{"generated":"","tasks":[],"rows":[],"pending":[]};

ontier", "models": "model", "lang": "English"}, "en": {"title": "Finance LLM Leaderboard", "lede": "Finance-specific models, general open models, and frontier models on the same 7 finance tasks. Score = accuracy (0–100). The average of sentiment analysis and numerical reasoning blocks gives the overall score. Local models on 64 GB M1 Max, 4-bit.", "all": "All", "orfree": "OpenRouter free", "orpaid": "OpenRouter paid", "base": "General open", "unc": "Uncensored", "fin": "Finance fine-tuned", "search": "Search models…", "queued": "Queued", "tasks": "Tasks", "task": "Task", "block": "Block", "qs": "Questions", "metric": "Metric", "method": "Method", "m1": "No judge model: answers are scored rule-based. 1% tolerance for numerical answers; percentage and decimal notations (14.5 ↔ 0.145) are considered equivalent. Token F1 for TAT-QA text answers.", "m2": "Temperature 0, fixed seed (seed 1234). Thinking mode turned off for models where it can be disabled; 1024 token thinking budget for thinking models.", "m3": "Local models were queried one by one on llama.cpp (GGUF) or mlx-lm (MLX) server.", "m4": "Frontier and OpenRouter models were queried in batches via CLIs (codex, opencode, agy, muse) (sentiment 80, numerical 10 questions/call) and tool use was prohibited by prompt alone. These rows are not under the exact same conditions as local models.", "m5": "There are 50–235 questions per task; 2–3 point differences may not be significant.", "m6": "If truncation % is high, the model hit the token limit; the score may remain low.", "overall": "Overall", "sent": "Sentiment", "num": "Numeric", "avg": "avg.", "trunc": "Truncation %", "bestF": "Best frontier", "bestL": "Best local", "bestFin": "Best finance fine-tuned", "done": "Completed", "mq": "models queued", "none": "none yet", "g_base": "general", "g_fin": "finance", "g_unc": "uncensored", "inc": "incomplete", "upd": "Updated", "qpm": "questions/model", "foot": "Source: finance-llm-bench · reproducible with bench.py report", "slow": "slow, skipped", "filter": "Filter", "g_orfree": "openrouter free", "g_or": "openrouter", "g_front": "frontier", "models": "models", "lang": "Türkçe"}};
const state = { g: "all", q: "", sort: "overall", dir: -1, lang: "en" };

}

  { k: "model", l: "Model", cls: "l model" },
  { k: "overall", l: t("overall") },
  { k: "sentiment", l: t("sent"), blk: t("avg"), sep: true },
  ...DATA.tasks.filter(t => t.block === "sentiment").map(t => ({ k: t.key, l: t.label, heat: true })),
  { k: "numeric", l: t("num"), blk: t("avg"), sep: true },
  ...DATA.tasks.filter(t => t.block === "numeric").map(t => ({ k: t.key, l: t.label, heat: true })),
  { k: "tok_s", l: "tok/s", sep: true },

function head() {
  document.querySelector("#t thead").innerHTML = "<tr>" + cols().map(c =>
    `<th class="${c.cls && c.cls.includes("l") ? "l" : ""} ${state.sort === c.k ? "sorted" : ""} ${c.sep ? "sep" : ""}">${c.nosort ? c.l :
      `<button data-k="${c.k}">${c.l}${state.sort === c.k ? (state.dir < 0 ? " ↓" : " ↑") : ""}</button>`}${c.blk ? `<span class="blk">${c.blk}</span>` : ""}</th>`).join("") + "</tr>";
